server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The hash router keeps every screen on index.html, so no SPA rewrite is needed.
    location / {
        try_files $uri $uri/ =404;
    }

    # The service worker must never be served stale, or the app freezes on an old
    # CACHE_NAME and never picks up a new shell.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # index.html and the content packs change every deploy; revalidate them.
    location = /index.html {
        add_header Cache-Control "no-cache";
        expires off;
    }
    location /content/ {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # The service worker precaches these anyway; a week of browser cache is safe.
    location ~* \.(css|js|svg|png|jpg|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 512;
}
